name: PR Check

# release.yml only runs on tags, so until now nothing validated a pull
# request. Same Lua syntax check, wired to PRs and to main.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Lua compiler
        run: |
          set -euo pipefail
          if command -v luac5.1 >/dev/null 2>&1; then
            echo "LUAC_BIN=$(command -v luac5.1)" >> "$GITHUB_ENV"
          elif command -v luac >/dev/null 2>&1; then
            echo "LUAC_BIN=$(command -v luac)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y lua5.1
            echo "LUAC_BIN=$(command -v luac5.1)" >> "$GITHUB_ENV"
          fi

      - name: Lua syntax check (core project)
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            "$LUAC_BIN" -p "$file"
          done < <(git ls-files '*.lua' ':!:API/**' ':!:Addons/**')
